# Configuration C7 Haute Résolution (Hi-Res Prostate FOV: 128x128x20)
# Couverture spatiale étendue (64 mm x 64 mm x 60 mm) pour englober 100 % de la prostate
# Encodeurs SegResNet 3D + MLP Clinique + Cross-Attention Bidirectionnelle + Gating
#
# Usage :
#   python3 -m src.training.train_cross_attention --config configs/phase5_c7_cross_attention_clinical_hires.yaml

experiment_name: phase5_c7_cross_attention_clinical_hires
modalities:
  - t2w
  - adc
  - hbv
n_folds: 5
batch_size: 4
n_epochs: 30
class_weight_pos: 2.5
learning_rate: 0.0001
weight_decay: 0.00001
init_filters: 16
encoder_dim: 256
fusion_dim: 128
num_heads: 4
num_layers: 2
ffn_dim: 256
dropout: 0.15
shared_weights: false
use_clinical: true
fusion_mode: cross_attention
use_gating: true
align_to_t2w: true
target_shape:
  - 128
  - 128
  - 20
seed: 42
